<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fattu speng!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f172a;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* Pulsante Principale */
        .btn-main {
            padding: 16px 36px;
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.4), 0 4px 6px -2px rgba(0, 0, 0, 0.2);
            transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-main:hover {
            background: linear-gradient(135deg, #f87171 0%, #dc2626 100%);
            transform: translateY(-2px);
            box-shadow: 0 14px 28px -5px rgba(239, 68, 68, 0.55), 0 6px 10px -2px rgba(0, 0, 0, 0.25);
        }

        .btn-main:active {
            transform: translateY(1px) scale(0.97);
            box-shadow: 0 6px 12px -2px rgba(239, 68, 68, 0.4);
        }

        /* Banner Personalizzato JS */
        .custom-banner {
            position: fixed;
            top: 28px;
            left: 50%;
            transform: translate(-50%, -150%);
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 18px;
            background: rgba(30, 41, 59, 0.94);
            color: #ffffff;
            padding: 20px 28px;
            border-radius: 16px;
            border: 1px solid rgba(239, 68, 68, 0.45);
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.7),
                        0 0 25px rgba(239, 68, 68, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                        opacity 0.25s ease;
            max-width: calc(100vw - 32px);
        }

        .custom-banner.show {
            transform: translate(-50%, 0);
            opacity: 1;
            pointer-events: auto;
        }

        /* Animazione al re-click se il banner è già mostrato */
        .custom-banner.pulse {
            animation: banner-pop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes banner-pop {
            0% { transform: translate(-50%, 0) scale(1); }
            50% { transform: translate(-50%, 0) scale(1.08); }
            100% { transform: translate(-50%, 0) scale(1); }
        }

        .banner-icon {
            font-size: 1.9rem;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        .banner-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: -0.01em;
            white-space: nowrap;
        }

        .banner-close {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #cbd5e1;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.15rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 6px;
            transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
        }

        .banner-close:hover {
            background: rgba(239, 68, 68, 0.35);
            color: #ffffff;
            transform: scale(1.1);
        }

        .banner-close:active {
            transform: scale(0.95);
        }

        @media (max-width: 600px) {
            .custom-banner {
                top: 16px;
                left: 16px;
                right: 16px;
                height: calc(50dvh - 66px);
                max-width: none;
                padding: 24px;
                flex-direction: column;
                justify-content: center;
                gap: 16px;
                transform: translateY(calc(-100% - 24px));
            }

            .custom-banner.show {
                transform: translateY(0);
            }

            .custom-banner.pulse {
                animation-name: banner-pop-mobile;
            }

            @keyframes banner-pop-mobile {
                0% { transform: translateY(0) scale(1); }
                50% { transform: translateY(0) scale(1.04); }
                100% { transform: translateY(0) scale(1); }
            }

            .banner-icon {
                font-size: clamp(2.5rem, 8dvh, 4rem);
            }

            .banner-text {
                font-size: clamp(1.5rem, 5dvh, 2.5rem);
                text-align: center;
            }

            .banner-close {
                position: absolute;
                top: 14px;
                right: 14px;
                margin-left: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Pulsante principale -->
    <button id="alertBtn" class="btn-main">Clicca qui</button>

    <!-- Banner personalizzato JS -->
    <div id="customBanner" class="custom-banner" role="alert" aria-live="assertive">
        <span class="banner-icon" aria-hidden="true">🖕🏿</span>
        <span class="banner-text">Fattu speng!</span>
        <button id="closeBannerBtn" class="banner-close" aria-label="Chiudi">&times;</button>
    </div>

    <script>
        // ========================================================
        // 1. CONFIGURAZIONE AUDIO
        // ========================================================
        // Gli audio vengono riprodotti in ordine a ogni clic.
        // audio7.mp3 è facoltativo: basta aggiungerlo alla cartella audio.
        const audioFiles = [
            'audio/audio1.mp3',
            'audio/audio2.mp3',
            'audio/audio3.mp3',
            'audio/audio4.mp3',
            'audio/audio5.mp3',
            'audio/audio6.mp3',
            'audio/audio7.mp3'
        ];

        let nextAudioIndex = 0;
        let currentAudio = null;

        function playNextAudio() {
            const selectedFile = audioFiles[nextAudioIndex];
            nextAudioIndex = (nextAudioIndex + 1) % audioFiles.length;

            // Ferma e resetta eventuale audio ancora in riproduzione dal clic precedente
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }

            const audio = new Audio(selectedFile);
            currentAudio = audio;
            if (selectedFile === 'audio/audio7.mp3') {
                audio.addEventListener('error', () => {
                    // Se il settimo file non è ancora presente, riparti dal primo.
                    if (audioFiles[audioFiles.length - 1] !== selectedFile) return;
                    audioFiles.pop();
                    if (currentAudio === audio) {
                        nextAudioIndex = 0;
                        playNextAudio();
                    }
                }, { once: true });
            }
            audio.play().catch(error => {
                if (selectedFile === 'audio/audio7.mp3') return;
                // Avviso pulito in console senza bloccare la pagina
                console.warn(`[Audio] Impossibile riprodurre "${selectedFile}":`, error.message);
            });
        }

        // ========================================================
        // 2. GESTIONE BANNER PERSONALIZZATO JS
        // ========================================================
        const banner = document.getElementById('customBanner');
        const closeBannerBtn = document.getElementById('closeBannerBtn');
        const alertBtn = document.getElementById('alertBtn');

        // Tempo in millisecondi prima della scomparsa automatica (3500ms = 3.5s)
        // Imposta a 0 se preferisci che rimanga visibile finché non viene cliccata la 'X'
        const AUTO_DISMISS_DELAY_MS = 3500;
        let dismissTimeoutId = null;

        function showBanner() {
            if (!banner) return;

            // Se il banner è già mostrato, riavvia l'effetto pop
            if (banner.classList.contains('show')) {
                banner.classList.remove('pulse');
                void banner.offsetWidth; // Forza il reflow per riattivare l'animazione CSS
                banner.classList.add('pulse');
            } else {
                banner.classList.add('show');
            }

            // Reset del timer di auto-chiusura
            if (dismissTimeoutId) {
                clearTimeout(dismissTimeoutId);
            }
            if (AUTO_DISMISS_DELAY_MS > 0) {
                dismissTimeoutId = setTimeout(() => {
                    hideBanner();
                }, AUTO_DISMISS_DELAY_MS);
            }
        }

        function hideBanner() {
            if (!banner) return;
            banner.classList.remove('show');
            banner.classList.remove('pulse');
            if (dismissTimeoutId) {
                clearTimeout(dismissTimeoutId);
                dismissTimeoutId = null;
            }
        }

        // Chiudi il banner con la 'X'
        closeBannerBtn.addEventListener('click', hideBanner);

        // Chiudi il banner con il tasto Esc
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                hideBanner();
            }
        });

        // ========================================================
        // 3. EVENTO AL CLIC DEL TASTO
        // ========================================================
        alertBtn.addEventListener('click', () => {
            // Mostra il banner personalizzato
            showBanner();

            // Riproduce l'audio successivo nella sequenza
            playNextAudio();
        });
    </script>

</body>
</html>
